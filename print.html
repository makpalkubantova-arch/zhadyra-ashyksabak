<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Басып шығаратын материалдар — Құрлық сулары</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:"Times New Roman",serif;color:#111;margin:0;background:#eee}
.bar{position:sticky;top:0;background:#fff;padding:10px 16px;border-bottom:1px solid #ccc;font-family:Arial,sans-serif;display:flex;gap:10px;align-items:center}
.bar button{padding:8px 14px;font-size:15px;cursor:pointer}
.page{width:210mm;min-height:297mm;margin:10mm auto;background:#fff;padding:14mm;page-break-after:always}
h1{font-size:20pt;margin:0 0 6px}h2{font-size:16pt;margin:0 0 6px}
p,li,td,th{font-size:13pt}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.qc{border:2px dashed #999;border-radius:6mm;height:58mm;padding:5mm;position:relative;display:flex;flex-direction:column;justify-content:center;font-family:Arial,sans-serif}.qn{position:absolute;top:3mm;left:3mm;width:8mm;height:8mm;border-radius:50%;background:#1e6fd9;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.qq{font-size:12.5pt;font-style:italic;line-height:1.3}.qa{font-size:10.5pt;color:#444;margin-top:2mm}.qh{font-size:10pt;margin-top:3mm}
.drop{border:2px dashed #999;border-radius:10mm;height:58mm;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Arial,sans-serif}
.drop .i{font-size:34pt}.drop .n{font-size:18pt;font-weight:700}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #333;padding:6px 8px;vertical-align:top;text-align:left}
.line{border-bottom:1px solid #333;height:22px}
.name{margin:6px 0 12px;font-size:13pt}
.small{font-size:11pt;color:#444}
.ws{border:1px solid #333;padding:8mm;margin-bottom:6mm;page-break-inside:avoid}
.ws-page{font-family:Montserrat,Arial,sans-serif;padding:10mm 12mm}
.ws-banner{height:38mm;border-radius:6mm;background:linear-gradient(90deg,rgba(6,50,110,.75),rgba(6,50,110,.15)),url(bg.jpg) center/cover;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 8mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ws-k{font-size:10pt;opacity:.9;letter-spacing:.05em}.ws-t{font-size:26pt;font-weight:800}.ws-s{font-size:12pt;opacity:.95}
.ws-v{background:#fff;color:#0b4fb0;border-radius:50%;width:24mm;height:24mm;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24pt;font-weight:800;line-height:1}.ws-v small{font-size:8pt;font-weight:600}
.ws-meta{display:flex;gap:6mm;margin:5mm 0;font-size:11.5pt;font-weight:600}.ws-meta div:first-child{flex:1}.ws-l{display:inline-block;width:70mm;border-bottom:1px solid #333}
.ws-task{display:flex;gap:4mm;align-items:flex-start;border:1.5px solid #bcd6f2;border-radius:4mm;padding:4mm;margin-bottom:4mm;background:#f6fbff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ws-n{flex:none;width:9mm;height:9mm;border-radius:50%;background:#1e6fd9;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ws-b{flex:1}.ws-q{font-size:12.5pt;font-weight:600;margin-bottom:2mm}.ws-a{border-bottom:1px dashed #7aa7d6;height:8mm}
.ws-p{flex:none;font-size:10pt;color:#0b4fb0;font-weight:700}
.ws-foot{display:flex;justify-content:space-between;font-size:11.5pt;margin-top:3mm}.ws-sum{font-weight:800;color:#0b4fb0}
.ws-self{margin-top:4mm;text-align:center;font-size:11pt;background:#eef6ff;border-radius:4mm;padding:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cut{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:6mm}.cutc{border:2px dashed;border-radius:3mm;height:28mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:3mm;font-family:Arial,sans-serif;font-size:13pt;font-weight:600}
.stick{display:grid;grid-template-columns:1fr 1fr;gap:5mm}.stick div{border:2px solid #333;border-radius:4mm;height:95mm;padding:4mm;font-family:Arial,sans-serif;font-size:14pt}
.ws-img{flex:none;width:34mm;height:23mm;object-fit:cover;border-radius:3mm;border:1px solid #bcd6f2}
.cover{display:flex;flex-direction:column;font-family:Montserrat,Arial,sans-serif}
.cv-img{height:95mm;border-radius:6mm;background:center/cover;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-k{margin-top:6mm;color:#1e6fd9;font-weight:800;font-size:12pt;letter-spacing:.04em}
.cv-t{font-size:24pt;line-height:1.2;margin:3mm 0 5mm;color:#0b2a55}
.cv-g{display:grid;grid-template-columns:1fr 1fr;gap:4mm}.cv-g div{background:#eef6ff;border-left:3mm solid #1e6fd9;border-radius:3mm;padding:4mm;font-size:11.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}.cv-g b{display:block;color:#0b4fb0;margin-bottom:1mm}
.cv-l{font-size:13pt;line-height:1.8}.cv-s{margin-top:auto;color:#456;font-size:12pt}
.bk-card{display:flex;gap:5mm;border:2.5px solid;border-radius:5mm;padding:4mm;margin:5mm 0;page-break-inside:avoid;font-family:Montserrat,Arial,sans-serif}
.bk-img{flex:none;width:55mm;height:95mm;border-radius:4mm;background:center/cover;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bk-img span{position:absolute;left:3mm;bottom:3mm;color:#fff;font-weight:800;font-size:12pt;padding:2mm 3mm;border-radius:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bk-body{flex:1}.bk-p{font-size:12pt;margin-bottom:2mm}.bk-q{font-size:11.5pt;margin-bottom:2mm}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:7mm;margin-top:6mm;justify-items:center}
.sk{width:52mm;height:52mm;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 75%);border:2mm solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.2mm #fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:Montserrat,Arial,sans-serif}
.sk-in{text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}.sk-d{font-size:20pt}.sk-p{font-size:30pt;font-weight:900;line-height:1}.sk-b{font-size:11pt;font-weight:800}.sk-w{font-size:10pt;font-weight:800;margin-top:1mm;background:rgba(255,255,255,.9);color:var(--c);text-shadow:none;border-radius:3mm;padding:.5mm 2mm}
.tent{display:flex;flex-direction:column;justify-content:space-between;padding:10mm}
.tn{height:125mm;border:3px solid var(--c);border-radius:6mm;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;font-family:Montserrat,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tn-img{position:absolute;inset:0;background:center/cover}
.tn-t,.tn-s{position:relative;background:rgba(255,255,255,.92);color:var(--c);padding:2mm 8mm;border-radius:5mm;font-weight:900}
.tn-t{font-size:44pt;margin-bottom:3mm}.tn-s{font-size:15pt;margin-bottom:8mm;font-weight:700}
.tn.rot{transform:rotate(180deg)}.tn-fold{text-align:center;color:#888;font-size:10pt}
.page{box-sizing:border-box}
.cv-img{height:80mm!important}.cv-s{margin-top:6mm!important}
.cards{gap:4mm!important}.qc{height:52mm!important;padding:4mm!important}.qq{font-size:11.5pt!important}
.page table td,.page table th{font-size:10.5pt;padding:3px 6px}
.ws-page{padding:8mm 11mm!important}.ws-banner{height:30mm!important}.ws-t{font-size:22pt!important}
.ws-task{padding:3mm!important;margin-bottom:3mm!important}.ws-a{height:7mm!important}.ws-img{height:21mm!important;width:31mm!important}
.ws-meta{margin:3mm 0!important}.ws-self{margin-top:3mm!important}
@media print{.page{height:297mm;overflow:hidden}body{background:#fff}.bar{display:none}.page{margin:0;width:auto;min-height:auto}}
</style>
</head>
<body>
<div class="bar"><b>🖨 Материалдар</b><button onclick="print()">Басып шығару</button><span style="color:#666">Дәйексөз карточкалары · спикер парақтары · жұмыс парақтары · бағалау парағы</span></div>
<div id="out"></div>
<script src="data.js"></script>
<script>
const G=id=>GROUPS.find(g=>g.id===id);let h="";
// 0. Мұқаба және мазмұны
h+=`<div class="page cover"><div class="cv-img" style="background-image:url(img/panorama.svg)"></div>
<div class="cv-k">${LESSON.school} · ${LESSON.cls} · География · §26–27</div>
<h1 class="cv-t">${LESSON.topic}</h1>
<div class="cv-g"><div><b>🎯 1-мақсат</b>${LESSON.goals[0]}</div><div><b>🎯 2-мақсат</b>${LESSON.goals[1]}</div></div>
<h2 style="margin-top:8mm">Тапсырма парақтары — мазмұны</h2>
<ol class="cv-l"><li>Дәйексөз карточкалары (23) + жауап кілті</li><li>Спикерлердің дайындық парақтары (5 топ)</li><li>Топтық жұмыс (ТЖ): «Конвертте не бар?» — қиып алатын карточкалар</li><li>Оқулықпен жұмыс: «Детектив» — топтарға тапсырма карточкалары</li><li>Жұмыс парақтары — 5 нұсқа (5 балл)</li><li>Стикерлер «+1 балл» (24)</li><li>Топ атауы тақтайшалары (партаға)</li><li>Бағалау парағы (мұғалімге, 10 балл)</li></ol>
<div class="cv-s">Мұғалім: ${LESSON.teacher}</div></div>`;
// 1. Дәйексөз карточкалары (23) — түссіз, су атауы жоқ
const allQ=[...QUOTES.map((q,i)=>({...q,n:i+1})),...QUOTES_REST.map(q=>({...q,n:""}))];
for(let p=0;p<allQ.length;p+=12){h+=`<div class="page"><h2>Дәйексөз карточкалары ${p?"— жалғасы":""}</h2><p class="small">Есік алдында таратылады. Нөмірлі 10 карточканы оқитын оқушылар тақтадағы ретпен орнынан оқиды. Қалғандары өз тобын үнсіз табады.</p><div class="cards">`+
allQ.slice(p,p+12).map(q=>`<div class="qc">${q.n?`<span class="qn">${q.n}</span>`:""}<div class="qq">«${q.q}»</div><div class="qa">— ${q.a}</div><div class="qh">Менің тобым: ____________</div></div>`).join("")+`</div></div>`;}
// Жауап кілті (мұғалімге)
h+=`<div class="page"><h2>Дәйексөз карточкаларының жауап кілті (мұғалімге)</h2><table><tr><th>№</th><th>Дәйексөз</th><th>Авторы</th><th>Тобы</th></tr>${allQ.map((q,i)=>`<tr><td>${q.n||"—"}</td><td>«${q.q}»</td><td>${q.a}</td><td><b>${G(q.g).name}</b></td></tr>`).join("")}</table>
<p class="small">Парталарға топ атаулары жазылған тақтайшалар қойылады: Өзен (5), Көл (5), Мұздық (5), Батпақ (4), Жерасты суы (4).</p></div>`;
// 2. Спикерлердің дайындық парақтары
GROUPS.forEach(g=>{const s=SPEAKERS[g.id];h+=`<div class="page"><div class="ws-banner" style="height:34mm;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.05)),url(${g.img}) center/cover"><div><div class="ws-k">Спикердің дайындық парағы</div><div class="ws-t">${g.icon} ${g.name}</div></div></div>
<p class="small">Оқулық: ${s.pages}-беттер. Бос орындарды толтырып, сыныпқа 1 минутта түсіндір.</p>
<div class="name">Спикер: ______________________________</div>
<table><tr><th style="width:28%">Жоспар</th><th>Толтыр</th></tr>${s.plan.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}<div class="line"></div></td></tr>`).join("")}
<tr><td><b>Сыныпқа сұрағым</b></td><td><div class="line"></div><div class="line"></div></td></tr></table></div>`});
// 3. Жұмыс парақтары — әдемі дизайн
function wsType(q){q=q.toLowerCase();if(/жерасты|бұлақ|гейзер|минерал|артезиан/.test(q))return"zherasty";if(/батпақ|шымтезек|васюган/.test(q))return"batpak";if(/мұздық|қар сызығы/.test(q))return"muzdyk";if(/көл|байкал|каспий/.test(q))return"kol";if(/өзен|еңістіг/.test(q)&&!/жерасты/.test(q))return"ozen";return"zherasty"}
function wsPic(q){const g=wsType(q);const d=/қалай|түзіл|түр|пайда|жікте|себеб|дегеніміз/.test(q.toLowerCase());return `<img class="ws-img" src="img/${d?"d_"+g+".svg":g+".jpg"}">`}
const WS_IC=["🧭","💧","🏔️","🏞️","🌱"];
WORKSHEETS.forEach(w=>{h+=`<div class="page ws-page"><div class="ws-banner"><div><div class="ws-k">8 сынып · География · §26–27</div><div class="ws-t">Құрлық сулары</div><div class="ws-s">Жұмыс парағы</div></div><div class="ws-v">${w.n}<small>нұсқа</small></div></div>
<div class="ws-meta"><div>👤 Аты-жөні: <span class="ws-l"></span></div><div>⏱ 6 минут</div><div>⭐ 5 балл</div></div><div style="font-size:10pt;color:#456;margin:-2mm 0 3mm">«2 мысал» сұралса — екеуі де дұрыс болғанда 1 балл.</div>
${w.tasks.map((t,i)=>`<div class="ws-task"><div class="ws-n">${i+1}</div>${wsPic(t[0])}<div class="ws-b"><div class="ws-q">${WS_IC[i]} ${t[0]}</div><div class="ws-a"></div><div class="ws-a"></div></div><div class="ws-p">☐ 1 б.</div></div>`).join("")}
<div class="ws-foot"><div>Тексерген: ☐ өзім &nbsp; ☐ көршім &nbsp; ☐ мұғалім</div><div class="ws-sum">Барлығы: ____ / 5</div></div>
<div class="ws-self">Менің тамшым: 🌊 өзендей ағып тұрмын &nbsp; 🏞️ көлдей толқып тұрмын &nbsp; 🌾 батпақта тұрып қалдым</div></div>`});
// 3б. Топтық тапсырма: конверт карточкалары + жапсыру парағы
GROUPS.forEach(g=>{const c=GROUP_TASK.cards[g.id];const all=[...c.f,...c.u,...c.x].sort((a,b)=>a.length%3-b.length%3);
h+=`<div class="page"><div class="ws-banner" style="height:28mm"><div><div class="ws-t" style="font-size:22pt">✉️ Конвертте не бар? — «${g.name}» тобы</div><div class="ws-s">Қиып алып, конвертке салыңыз</div></div></div>
<div class="cut">${all.map(x=>`<div class="cutc" style="border-color:${g.color}">${x}</div>`).join("")}</div>
<h2 style="margin-top:10mm">Топтың парағы: «${g.name}»</h2><p class="small">Өз суларыңа қатысты карточкаларды бағандарға жапсырыңдар. 2 карточка — артық!</p>
<div class="stick"><div><b>🧭 Қалыптасуы</b></div><div><b>🏭 Шаруашылық маңызы</b></div></div></div>`});
// 3в. Оқулықпен жұмыс — «Детектив» топ карточкалары
GROUPS.forEach((g,gi)=>{const r=BOOK_TASK.rows[g.id];
if(gi%2===0)h+=`<div class="page"><h2>🕵️ Оқулықпен жұмыс: «Детектив» — топтарға карточка</h2><p class="small">Уақыты — 3 минут. Әр жол — 1 балл, барлығы — 3 балл. Дәптерге жазыңдар.</p>`;
h+=`<div class="bk-card" style="border-color:${g.color}"><div class="bk-img" style="background-image:url(${g.img})"><span style="background:${g.color}">${g.icon} ${g.name} тобы</span></div>
<div class="bk-body"><div class="bk-p">📖 Оқулық, <b>${r[0]}-бет</b></div>
${BOOK_TASK.cols.map((c,k)=>`<div class="bk-q"><b>${c}</b> — 1 балл<div class="line"></div><div class="line"></div></div>`).join("")}</div></div>`;
if(gi%2===1||gi===GROUPS.length-1)h+=`</div>`;});
// 5. Стикерлер (наклейкалар) — 1 балл
const WORDS=["Жарайсың!","Керемет!","Тамаша!","Білгір тамшы","Су маманы","Дұп-дұрыс!","Үздік жауап","Мықтысың!"];
for(let pg=0;pg<2;pg++){h+=`<div class="page"><h2>⭐ Стикерлер — «+1 балл» (тақтадағы сұрақ, спикер, сұрақ қойған оқушы)</h2><p class="small">Дөңгелек наклейка қағазына басып шығарыңыз (диаметрі 40 мм). Барлығы — 24 стикер.</p><div class="stk">`+
Array.from({length:12},(_,i)=>{const g=GROUPS[(i+pg*2)%5];const w=WORDS[(i+pg*4)%WORDS.length];return `<div class="sk" style="--c:${g.color}"><div class="sk-in"><div class="sk-d">💧</div><div class="sk-p">+1</div><div class="sk-b">балл</div><div class="sk-w">${w}</div></div></div>`}).join("")+`</div></div>`;}
// 6. Топ атауы тақтайшалары (партаға)
GROUPS.forEach(g=>{h+=`<div class="page tent"><div class="tn" style="--c:${g.color}"><div class="tn-img" style="background-image:url(${g.img})"></div><div class="tn-t">${g.icon} ${g.name}</div><div class="tn-s">тобы · ${g.count} оқушы</div></div>
<div class="tn-fold">— — — бүктеу сызығы — — —</div><div class="tn rot" style="--c:${g.color}"><div class="tn-img" style="background-image:url(${g.img})"></div><div class="tn-t">${g.icon} ${g.name}</div><div class="tn-s">тобы · ${g.count} оқушы</div></div></div>`});
// 4. Бағалау парағы (мұғалімге)
h+=`<div class="page"><h1>Бағалау парағы (мұғалімге)</h1><p class="small">${LESSON.topic}</p>
<table><tr><th>№</th><th>Оқушы</th><th>Топ</th>${CRITERIA.map(c=>`<th>${c.name} (${c.max})</th>`).join("")}<th>Барлығы (10)</th></tr>
${Array.from({length:23},(_,i)=>`<tr><td>${i+1}</td><td style="width:35%"></td><td></td>${CRITERIA.map(()=>"<td></td>").join("")}<td></td></tr>`).join("")}</table></div>`;
document.getElementById("out").innerHTML=h;
</script>
</body>
</html>
